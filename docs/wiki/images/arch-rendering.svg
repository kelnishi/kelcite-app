<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
<title id="t">How each kind of body reaches the 3D view</title>
<desc id="d">A mesh is drawn by rasterizing its triangles. A clay body has no triangles; a shader ray marches it, stepping along each pixel's view ray until it reaches the surface of the shape function. A mesh turned into clay is ray marched too, through a distance field built from the mesh in a worker and cached. Both paths end in the 3D view, drawn with Three.js on WebGL. Bake turns clay into a mesh, which then takes the triangle path.</desc>
<style>
svg{--bg:#ffffff;--ink:#1b1f2e;--muted:#4b5368;--edge:#5d6680;--n-fill:#f3f5f9;--n-stroke:#8d97ad;--b-fill:#e8f2fc;--b-stroke:#387dd1;--v-fill:#f1ebfb;--v-stroke:#6e49be;--y-fill:#e6ebf6;--y-stroke:#1f3666}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--ink:#e8ecf4;--muted:#aeb7c8;--edge:#9aa6bd;--n-fill:#161b26;--n-stroke:#56617a;--b-fill:#10263d;--b-stroke:#4dafe7;--v-fill:#211a3a;--v-stroke:#936ad5;--y-fill:#151d33;--y-stroke:#76d6f6}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.h{font-size:15.5px;font-weight:600}
.s{font-size:13.5px;fill:var(--muted)}
.lh{font-size:13.5px;font-weight:600;fill:var(--muted);letter-spacing:.04em}
.n{fill:var(--n-fill);stroke:var(--n-stroke);stroke-width:1.5}
.b{fill:var(--b-fill);stroke:var(--b-stroke);stroke-width:1.5}
.v{fill:var(--v-fill);stroke:var(--v-stroke);stroke-width:1.5}
.y{fill:var(--y-fill);stroke:var(--y-stroke);stroke-width:2}
.e{fill:none;stroke:var(--edge);stroke-width:1.75}
.d{fill:none;stroke:var(--edge);stroke-width:1.75;stroke-dasharray:6 5}
.ah{fill:var(--edge)}
.l{font-size:13.5px;fill:var(--muted)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="900" height="400" rx="12"/>
<text class="lh" x="20" y="36">BODY</text>
<text class="lh" x="300" y="36">HOW IT IS DRAWN</text>

<rect class="b" x="20" y="52" width="220" height="72" rx="10"/>
<text class="h" x="130" y="82" text-anchor="middle">Mesh</text>
<text class="s" x="130" y="104" text-anchor="middle">triangles, materials, textures</text>

<rect class="v" x="20" y="186" width="220" height="72" rx="10"/>
<text class="h" x="130" y="216" text-anchor="middle">Clay</text>
<text class="s" x="130" y="238" text-anchor="middle">a shape function, no triangles</text>

<rect class="v" x="20" y="300" width="220" height="72" rx="10"/>
<text class="h" x="130" y="330" text-anchor="middle">Mesh turned into clay</text>
<text class="s" x="130" y="352" text-anchor="middle">from its context menu</text>

<rect class="b" x="300" y="52" width="280" height="72" rx="10"/>
<text class="h" x="440" y="82" text-anchor="middle">Rasterize</text>
<text class="s" x="440" y="104" text-anchor="middle">draw its triangles</text>

<rect class="v" x="300" y="176" width="280" height="92" rx="10"/>
<text class="h" x="440" y="204" text-anchor="middle">Ray march</text>
<text class="s" x="440" y="226" text-anchor="middle">a shader steps along each pixel's</text>
<text class="s" x="440" y="245" text-anchor="middle">view ray until it meets the surface</text>

<rect class="n" x="300" y="300" width="280" height="72" rx="10"/>
<text class="h" x="440" y="330" text-anchor="middle">Distance field</text>
<text class="s" x="440" y="352" text-anchor="middle">built in a worker, cached locally</text>

<rect class="y" x="660" y="52" width="220" height="216" rx="10"/>
<text class="h" x="770" y="146" text-anchor="middle">3D view</text>
<text class="s" x="770" y="168" text-anchor="middle">Three.js on WebGL</text>

<path class="e" d="M242 88H296" marker-end="url(#a)"/>
<path class="e" d="M242 222H296" marker-end="url(#a)"/>
<path class="e" d="M242 336H296" marker-end="url(#a)"/>
<path class="e" d="M440 298V272" marker-end="url(#a)"/>
<path class="e" d="M582 88H656" marker-end="url(#a)"/>
<path class="e" d="M582 222H656" marker-end="url(#a)"/>

<path class="d" d="M130 184V128" marker-end="url(#a)"/>
<text class="l" x="142" y="161">Bake</text>
</svg>
