<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" width="640" height="140" role="img" aria-label="Now with screenshots!">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="140" rx="16" fill="url(#bg)"/>
  <!-- flash burst -->
  <g transform="translate(92 70)" fill="#fde68a">
    <polygon points="0,-58 8,-22 40,-42 24,-10 58,0 24,10 40,42 8,22 0,58 -8,22 -40,42 -24,10 -58,0 -24,-10 -40,-42 -8,-22"/>
  </g>
  <!-- camera -->
  <g transform="translate(60 44)">
    <rect x="0" y="12" width="64" height="44" rx="8" fill="#f8fafc"/>
    <rect x="18" y="4" width="22" height="12" rx="3" fill="#f8fafc"/>
    <circle cx="32" cy="34" r="15" fill="#1e293b"/>
    <circle cx="32" cy="34" r="10" fill="url(#gem)"/>
    <circle cx="27" cy="29" r="3" fill="#fff" opacity=".8"/>
    <rect x="50" y="18" width="8" height="5" rx="2" fill="#f59e0b"/>
  </g>
  <!-- text -->
  <text x="188" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">Now with</text>
  <text x="188" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#fde68a">screenshots!</text>
  <!-- sparkles -->
  <g fill="#fde68a">
    <polygon points="540,30 545,44 559,49 545,54 540,68 535,54 521,49 535,44"/>
    <polygon points="590,86 593,95 602,98 593,101 590,110 587,101 578,98 587,95"/>
    <polygon points="500,100 503,108 511,111 503,114 500,122 497,114 489,111 497,108"/>
  </g>
</svg>
