<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
<title id="t">Bake: from live geometry to a baked mesh</title>
<desc id="d">Two lanes: the main thread, which holds the interface, the view and the scene, and the work off the main thread in web workers, WebAssembly and the GPU. On Bake, a clay body goes off the main thread to contouring, which samples its shape function on a grid and builds a surface, on the GPU with WebGPU where available and otherwise in a worker. A mesh with modifiers sends its booleans to Manifold, compiled to WebAssembly, in a worker. Both results come back to the main thread as a scene edit: a baked mesh of plain triangles.</desc>
<style>
svg{--bg:#ffffff;--ink:#1b1f2e;--muted:#4b5368;--edge:#5d6680;--lane:#f5f7fb;--lane-stroke:#d5dbe6;--b-fill:#e8f2fc;--b-stroke:#387dd1;--v-fill:#f1ebfb;--v-stroke:#6e49be;--y-fill:#e6ebf6;--y-stroke:#1f3666}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--ink:#e8ecf4;--muted:#aeb7c8;--edge:#9aa6bd;--lane:#131925;--lane-stroke:#2a3346;--b-fill:#10263d;--b-stroke:#4dafe7;--v-fill:#211a3a;--v-stroke:#936ad5;--y-fill:#151d33;--y-stroke:#76d6f6}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.lane{fill:var(--lane);stroke:var(--lane-stroke);stroke-width:1}
.lh{font-size:16px;font-weight:600}
.h{font-size:16px;font-weight:600}
.s{font-size:13.5px;fill:var(--muted)}
.b{fill:var(--b-fill);stroke:var(--b-stroke);stroke-width:1.5}
.v{fill:var(--v-fill);stroke:var(--v-stroke);stroke-width:1.5}
.y{fill:var(--y-fill);stroke:var(--y-stroke);stroke-width:2}
.e{fill:none;stroke:var(--edge);stroke-width:1.75}
.ah{fill:var(--edge)}
.l{font-size:13.5px;fill:var(--muted)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="900" height="480" rx="12"/>
<rect class="lane" x="20" y="20" width="420" height="440" rx="12"/>
<rect class="lane" x="470" y="20" width="410" height="440" rx="12"/>
<text class="lh" x="40" y="50">Main thread</text>
<text class="s" x="40" y="70">the interface, the view, the scene</text>
<text class="lh" x="490" y="50">Off the main thread</text>
<text class="s" x="490" y="70">web workers, WebAssembly, the GPU</text>

<rect class="b" x="50" y="100" width="350" height="86" rx="10"/>
<text class="h" x="225" y="136" text-anchor="middle">Clay body</text>
<text class="s" x="225" y="160" text-anchor="middle">a shape function, with its modifiers</text>

<rect class="v" x="500" y="100" width="340" height="86" rx="10"/>
<text class="h" x="670" y="128" text-anchor="middle">Contouring</text>
<text class="s" x="670" y="150" text-anchor="middle">sample on a grid, build a surface</text>
<text class="s" x="670" y="170" text-anchor="middle">GPU (WebGPU) where available, else a worker</text>

<rect class="b" x="50" y="220" width="350" height="86" rx="10"/>
<text class="h" x="225" y="256" text-anchor="middle">Mesh with modifiers</text>
<text class="s" x="225" y="280" text-anchor="middle">booleans, extrudes, decals, texture maps</text>

<rect class="v" x="500" y="220" width="340" height="86" rx="10"/>
<text class="h" x="670" y="256" text-anchor="middle">Booleans</text>
<text class="s" x="670" y="280" text-anchor="middle">Manifold, WebAssembly, in a worker</text>

<rect class="y" x="50" y="360" width="350" height="76" rx="10"/>
<text class="h" x="225" y="392" text-anchor="middle">Baked mesh</text>
<text class="s" x="225" y="415" text-anchor="middle">plain triangles, what printers read</text>

<path class="e" d="M402 143H496" marker-end="url(#a)"/>
<text class="l" x="450" y="134" text-anchor="middle">Bake</text>
<path class="e" d="M402 263H496" marker-end="url(#a)"/>
<text class="l" x="450" y="254" text-anchor="middle">Bake</text>

<path class="e" d="M842 143H862V398H670"/>
<path class="e" d="M670 308V398H404" marker-end="url(#a)"/>
<text class="l" x="540" y="389" text-anchor="middle">result, as a scene edit</text>
</svg>
