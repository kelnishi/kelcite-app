<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
<title id="t">The first draw of a large mesh</title>
<desc id="d">Two lanes over time: the main thread, which draws the interface and the view, and a worker in the background. A large mesh appears on the main thread after a Bake, an undo or an open, and its arrays go to the worker, which builds the mesh's drawn geometry, the one copy every look draws from. Meanwhile a fog fills the mesh's bounds and the view keeps drawing. The drawn geometry comes back, the fog goes and a wireframe wipes in. The worker then builds a face list, and with it a pick resolves: the graphics card names the triangle under a ray. A click made before that waits, then takes effect where it was made.</desc>
<style>
svg{--bg:#ffffff;--ink:#1b1f2e;--muted:#4b5368;--edge:#5d6680;--lane:#f5f7fb;--lane-stroke:#d5dbe6;--b-fill:#e8f2fc;--b-stroke:#387dd1;--v-fill:#f1ebfb;--v-stroke:#6e49be;--y-fill:#e6ebf6;--y-stroke:#1f3666}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--ink:#e8ecf4;--muted:#aeb7c8;--edge:#9aa6bd;--lane:#131925;--lane-stroke:#2a3346;--b-fill:#10263d;--b-stroke:#4dafe7;--v-fill:#211a3a;--v-stroke:#936ad5;--y-fill:#151d33;--y-stroke:#76d6f6}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.lane{fill:var(--lane);stroke:var(--lane-stroke);stroke-width:1}
.lh{font-size:16px;font-weight:600}
.h{font-size:16px;font-weight:600}
.s{font-size:13.5px;fill:var(--muted)}
.b{fill:var(--b-fill);stroke:var(--b-stroke);stroke-width:1.5}
.v{fill:var(--v-fill);stroke:var(--v-stroke);stroke-width:1.5}
.y{fill:var(--y-fill);stroke:var(--y-stroke);stroke-width:2}
.e{fill:none;stroke:var(--edge);stroke-width:1.75}
.ah{fill:var(--edge)}
.l{font-size:13.5px;fill:var(--muted)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="900" height="410" rx="12"/>
<rect class="lane" x="20" y="20" width="860" height="170" rx="12"/>
<rect class="lane" x="20" y="210" width="860" height="150" rx="12"/>
<text class="lh" x="40" y="48">Main thread</text>
<text class="s" x="140" y="48">the interface and the view</text>
<text class="lh" x="40" y="238">Worker</text>
<text class="s" x="110" y="238">in the background</text>

<rect class="b" x="40" y="70" width="190" height="96" rx="10"/>
<text class="h" x="135" y="102" text-anchor="middle">Mesh appears</text>
<text class="s" x="135" y="126" text-anchor="middle">after a Bake, an undo</text>
<text class="s" x="135" y="146" text-anchor="middle">or an open</text>

<rect class="b" x="250" y="70" width="190" height="96" rx="10"/>
<text class="h" x="345" y="102" text-anchor="middle">Fog stands in</text>
<text class="s" x="345" y="126" text-anchor="middle">fills the mesh's bounds;</text>
<text class="s" x="345" y="146" text-anchor="middle">the view keeps drawing</text>

<rect class="b" x="460" y="70" width="190" height="96" rx="10"/>
<text class="h" x="555" y="102" text-anchor="middle">Mesh drawn</text>
<text class="s" x="555" y="126" text-anchor="middle">the fog goes and a</text>
<text class="s" x="555" y="146" text-anchor="middle">wireframe wipes in</text>

<rect class="y" x="670" y="70" width="190" height="96" rx="10"/>
<text class="h" x="765" y="102" text-anchor="middle">Picks resolve</text>
<text class="s" x="765" y="126" text-anchor="middle">the graphics card names</text>
<text class="s" x="765" y="146" text-anchor="middle">the triangle under a ray</text>

<rect class="v" x="250" y="258" width="190" height="84" rx="10"/>
<text class="h" x="345" y="288" text-anchor="middle">Builds the mesh</text>
<text class="s" x="345" y="312" text-anchor="middle">the one copy every</text>
<text class="s" x="345" y="330" text-anchor="middle">look draws from</text>

<rect class="v" x="670" y="258" width="190" height="84" rx="10"/>
<text class="h" x="765" y="288" text-anchor="middle">Builds a face list</text>
<text class="s" x="765" y="312" text-anchor="middle">what a pick on the</text>
<text class="s" x="765" y="330" text-anchor="middle">mesh resolves against</text>

<path class="e" d="M231 118H248" marker-end="url(#a)"/>
<path class="e" d="M441 118H458" marker-end="url(#a)"/>
<path class="e" d="M651 118H668" marker-end="url(#a)"/>

<path class="e" d="M135 168V300H248" marker-end="url(#a)"/>
<text class="l" x="145" y="290">arrays</text>
<path class="e" d="M442 300H520V168" marker-end="url(#a)"/>
<text class="l" x="456" y="290">geometry</text>
<path class="e" d="M600 168V300H668" marker-end="url(#a)"/>
<text class="l" x="608" y="252">once drawn</text>
<path class="e" d="M765 256V168" marker-end="url(#a)"/>

<text class="l" x="450" y="390" text-anchor="middle">A click, a hover or a re-pivot made before the last step waits, then takes effect where it was made.</text>
</svg>
